<!DOCTYPE html>
<html>
<head>
    <title>Student Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #243b64;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            background-color: #243b64;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .task {
            background: #eef2f7;
            padding: 12px;
            margin-top: 12px;
            border-radius: 5px;
        }

        #message {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Task Manager</h1>

    <h3>Add New Task</h3>

    <input type="text" id="title" placeholder="Task Title">

    <input type="text" id="description" placeholder="Task Description">

    <input type="text" id="status" placeholder="Status (Pending / Completed)">

    <button onclick="addTask()">Add Task</button>

    <p id="message"></p>

    <h3>My Tasks</h3>

    <div id="tasks">Loading tasks...</div>

</div>

<script>

const API = "http://localhost:8082/api/tasks";

// Load all tasks
async function loadTasks() {

    const tasksDiv = document.getElementById("tasks");
    const message = document.getElementById("message");

    tasksDiv.innerHTML = "Loading tasks...";
    message.innerText = "";

    try {

        const response = await fetch(API);

        if (!response.ok) {
            throw new Error("Unable to load tasks");
        }

        const tasks = await response.json();

        tasksDiv.innerHTML = "";

        if (tasks.length === 0) {
            tasksDiv.innerText = "No tasks available.";
            return;
        }

        tasks.forEach(task => {

            const div = document.createElement("div");
            div.className = "task";

            const title = document.createElement("h3");
            title.textContent = task.title;

            const description = document.createElement("p");
            description.textContent = task.description;

            const status = document.createElement("p");
            status.textContent = "Status: " + task.status;

            const updateButton = document.createElement("button");
            updateButton.textContent = "Update";
            updateButton.onclick = () => updateTask(task.id);

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.onclick = () => deleteTask(task.id);

            div.append(title, description, status,
                       updateButton, deleteButton);

            tasksDiv.appendChild(div);
        });

    } catch (error) {
        tasksDiv.innerText = "";
        message.innerText = "Error: " + error.message;
    }
}

// Add task
async function addTask() {

    const task = {
        title: document.getElementById("title").value,
        description: document.getElementById("description").value,
        status: document.getElementById("status").value
    };

    if (!task.title.trim()) {
        document.getElementById("message").innerText =
            "Please enter a task title.";
        return;
    }

    try {

        const response = await fetch(API, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(task)
        });

        if (!response.ok) {
            throw new Error("Task creation failed");
        }

        document.getElementById("title").value = "";
        document.getElementById("description").value = "";
        document.getElementById("status").value = "";

        document.getElementById("message").innerText = "";

        loadTasks();

    } catch (error) {
        document.getElementById("message").innerText =
            error.message;
    }
}

// Update task
async function updateTask(id) {

    const title = prompt("Enter new task title:");

    if (title === null) return;

    const description = prompt("Enter new description:");

    if (description === null) return;

    const status = prompt("Enter new status:");

    if (status === null) return;

    try {

        const response = await fetch(`${API}/${id}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title,
                description,
                status
            })
        });

        if (!response.ok) {
            throw new Error("Update failed");
        }

        loadTasks();

    } catch (error) {
        document.getElementById("message").innerText =
            error.message;
    }
}

// Delete task
async function deleteTask(id) {

    if (!confirm("Are you sure you want to delete this task?")) {
        return;
    }

    try {

        const response = await fetch(`${API}/${id}`, {
            method: "DELETE"
        });

        if (!response.ok) {
            throw new Error("Delete failed");
        }

        loadTasks();

    } catch (error) {
        document.getElementById("message").innerText =
            error.message;
    }
}

// Load tasks when page opens
loadTasks();

</script>

</body>
</html>
